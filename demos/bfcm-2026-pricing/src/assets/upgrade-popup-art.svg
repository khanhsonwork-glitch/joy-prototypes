<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="482" viewBox="0 0 620 241">
  <!-- Header art of the upgrade popup, drawn for this prototype: deep blue sky, a rocket, planets. -->
  <defs>
    <radialGradient id="glow" cx="0.5" cy="0.55" r="0.6">
      <stop offset="0" stop-color="#2a27b8"/>
      <stop offset="1" stop-color="#06038d"/>
    </radialGradient>
    <linearGradient id="hull" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b9b4ff"/>
      <stop offset="1" stop-color="#7c74f0"/>
    </linearGradient>
    <linearGradient id="flame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd166"/>
      <stop offset="1" stop-color="#ff8a3d"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#ffe08a"/>
      <stop offset="1" stop-color="#f2a516"/>
    </radialGradient>
    <radialGradient id="pink" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#ffb3e6"/>
      <stop offset="1" stop-color="#e0459f"/>
    </radialGradient>
    <radialGradient id="teal" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#8fe3ff"/>
      <stop offset="1" stop-color="#2b8be0"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>
  <rect width="620" height="241" fill="url(#glow)"/>
  <!-- stars -->
  <g fill="#ffffff">
    <circle cx="60" cy="40" r="1.4" opacity="0.8"/>
    <circle cx="210" cy="28" r="1.1" opacity="0.6"/>
    <circle cx="250" cy="200" r="1.3" opacity="0.7"/>
    <circle cx="400" cy="40" r="1.2" opacity="0.7"/>
    <circle cx="560" cy="200" r="1.4" opacity="0.6"/>
    <circle cx="590" cy="70" r="1" opacity="0.8"/>
    <circle cx="120" cy="120" r="1" opacity="0.5"/>
    <circle cx="470" cy="150" r="1" opacity="0.5"/>
    <circle cx="350" cy="215" r="1.1" opacity="0.6"/>
  </g>
  <!-- planets -->
  <circle cx="138" cy="48" r="38" fill="url(#sun)" filter="url(#soft)" opacity="0.9"/>
  <circle cx="548" cy="146" r="36" fill="url(#pink)" filter="url(#soft)" opacity="0.9"/>
  <circle cx="492" cy="34" r="12" fill="url(#teal)"/>
  <g transform="translate(60 182)">
    <circle r="20" fill="#a98bff"/>
    <ellipse rx="34" ry="9" fill="none" stroke="#ffd166" stroke-width="5" transform="rotate(-14)"/>
  </g>
  <!-- smoke -->
  <g fill="#ffffff" opacity="0.95">
    <circle cx="262" cy="196" r="20"/>
    <circle cx="240" cy="210" r="13"/>
    <circle cx="288" cy="214" r="14"/>
    <circle cx="232" cy="184" r="8"/>
    <circle cx="300" cy="190" r="9"/>
  </g>
  <!-- rocket, tilted up and to the right -->
  <g transform="translate(318 112) rotate(35)">
    <path d="M-12 46 Q0 84 12 46 Z" fill="url(#flame)"/>
    <path d="M-26 24 L-44 52 L-20 44 Z" fill="#ffb84d"/>
    <path d="M26 24 L44 52 L20 44 Z" fill="#ffb84d"/>
    <path d="M0 -78 C26 -50 30 -8 26 44 L-26 44 C-30 -8 -26 -50 0 -78 Z" fill="url(#hull)"/>
    <rect x="-27" y="20" width="54" height="10" rx="3" fill="#ff6fa1"/>
    <rect x="-24" y="-10" width="48" height="5" rx="2.5" fill="#e9e6ff"/>
    <circle cx="0" cy="-34" r="14" fill="#e9e6ff"/>
    <circle cx="0" cy="-34" r="9" fill="#4c43d6"/>
    <line x1="0" y1="-78" x2="0" y2="-92" stroke="#e9e6ff" stroke-width="3" stroke-linecap="round"/>
    <circle cx="0" cy="-94" r="4" fill="#e9e6ff"/>
  </g>
</svg>
