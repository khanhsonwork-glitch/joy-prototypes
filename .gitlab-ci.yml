# Repo nhà: avada/starlink-team/joy-prototypes trên GitLab công ty (Thomas 19/11: "1 git chung").
# Merge Request nào cũng được kiểm đủ (secret, dữ liệu thật, license, test trình duyệt).
# Merge vào main → kiểm đủ → deploy link chung https://joy-prototypes.web.app. Không ai deploy tay, không ai đẩy thẳng main.
# Link xem thử riêng cho MR chỉ có khi nhánh tên preview/<việc> (nhánh được bảo vệ, chỉ Maintainer đẩy được),
# vì khoá deploy là biến CI Protected: GitLab không đưa nó cho nhánh thường.
# Khoá deploy: biến CI FIREBASE_SA_B64 (Masked + Protected) = khoá service account chỉ có quyền Firebase Hosting
# của project joy-prototypes, mã hoá base64 để GitLab che được trong log.

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api"

# Ảnh Playwright đúng phiên bản trong package.json: có sẵn Chromium + thư viện hệ thống.
image: mcr.microsoft.com/playwright:v1.61.1-noble

variables:
  GIT_DEPTH: "0"          # check-reference đọc demo nào MR đang đổi → cần đủ lịch sử
  npm_config_cache: "$CI_PROJECT_DIR/.npm"

default:
  tags: [docker, linux]
  cache:
    key:
      files: [package-lock.json]
    paths: [.npm/]
  before_script:
    - node --version
    - npm ci --no-audit --no-fund

stages: [check, deploy]

check:
  stage: check
  script:
    - npm run check
  artifacts:
    when: always
    expire_in: 14 days
    paths: [evidence/, dist/]

.firebase:
  stage: deploy
  needs: [check]
  cache: []
  before_script:
    - test -n "$FIREBASE_SA_B64" || { echo "Thiếu biến CI FIREBASE_SA_B64 (chỉ có ở main và nhánh preview/*)"; exit 1; }
    - umask 077 && echo "$FIREBASE_SA_B64" | base64 -d > "$CI_BUILDS_DIR/firebase-sa.json"
    - export GOOGLE_APPLICATION_CREDENTIALS="$CI_BUILDS_DIR/firebase-sa.json"
  after_script:
    - rm -f "$CI_BUILDS_DIR/firebase-sa.json"

preview:
  extends: .firebase
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME =~ /^preview\//
  script:
    - cd dist
    - npx --yes firebase-tools@14 hosting:channel:deploy "mr$CI_MERGE_REQUEST_IID" --project joy-prototypes --expires 14d --json > ../preview.json
    - cd ..
    - node -e "const r=require('./preview.json');const u=Object.values(r.result||{})[0]?.url;if(!u){console.error(r.status,r.error);process.exit(1)}console.log('Link xem thử:',u);require('fs').writeFileSync('preview.env','PREVIEW_URL='+u+'\n')"
  artifacts:
    reports:
      dotenv: preview.env
  environment:
    name: review/mr$CI_MERGE_REQUEST_IID
    url: $PREVIEW_URL

live:
  extends: .firebase
  resource_group: live    # một lần deploy live một lúc; merge sau xếp hàng chờ
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - cd dist
    - npx --yes firebase-tools@14 deploy --only hosting --project joy-prototypes --non-interactive
    - for i in 1 2 3 4 5 6; do curl -fsS https://joy-prototypes.web.app/ -o /tmp/live.html && break; sleep 10; done
    - grep -q "Thử từng tính năng" /tmp/live.html
  environment:
    name: live
    url: https://joy-prototypes.web.app
