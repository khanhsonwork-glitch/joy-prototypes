# Merge into main = the only way the shared live link changes.
name: Deploy live
on:
  push:
    branches: [main]
permissions:
  checks: write
  contents: read
# One live deploy at a time; a newer merge waiting in line replaces an older one that has not started.
concurrency:
  group: live
  cancel-in-progress: false
jobs:
  check_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JOY_PROTOTYPES }}
          projectId: joy-prototypes
          entryPoint: dist
          channelId: live
